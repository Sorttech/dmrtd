name: dmrtd
description: Dart implementation of ICAO Doc 9303 MRTD, created by ZeroPass

version: 2.0.1
repository: https://github.com/Sorttech/dmrtd

environment:
  sdk: ^3.6.0

dependencies:
  collection: ^1.19.0
  convert: ^3.1.2
  crypto: ^3.0.6
  fixnum: ^1.1.1
  # Pinned exactly: avoids unintended uplifts during downstream `pub upgrade`
  # runs while a known-good combination is in production (see CHANGES.md).
  flutter_nfc_kit: 3.6.2
  logging: ^1.3.0
  meta: ^1.15.0
  tripledes_nullsafety: ^1.0.3
  pointycastle: ^3.9.1

dev_dependencies:
  flutter: # needed for flutter_nfc_kit
    sdk: flutter
  flutter_lints: ^2.0.1
  flutter_test: # needed for flutter_nfc_kit
    sdk: flutter
  lints: ^2.0.0
  test: ^1.16.5